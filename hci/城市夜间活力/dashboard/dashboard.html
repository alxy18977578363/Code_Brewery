<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>上海夜间消费活力大屏</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;700&family=ZCOOL+XiaoWei&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg: #f5d2c8;
      --bg-soft: #f9e3d9;
      --ink: #3b2e2a;
      --muted: #7a5c55;
      --panel: #fff7f3;
      --accent: #d16b5f;
      --accent-2: #f0a25b;
      --accent-3: #7b8c99;
      --border: rgba(84, 56, 50, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Lexend", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: linear-gradient(160deg, var(--bg) 0%, var(--bg-soft) 60%);
      min-height: 100vh;
    }

    .page {
      max-width: 1600px;
      margin: 0 auto;
      padding: 28px 28px 40px;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }

    header h1 {
      margin: 0;
      font-family: "ZCOOL XiaoWei", serif;
      font-size: clamp(26px, 3vw, 42px);
      letter-spacing: 1px;
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .kpi-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 18px;
      box-shadow: 0 8px 18px rgba(88, 60, 54, 0.08);
    }

    .kpi-card span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    .kpi-card strong {
      display: block;
      font-size: 26px;
      margin-top: 6px;
      color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(300px, 1.2fr) minmax(420px, 1.4fr) minmax(260px, 1fr);
      grid-template-rows: repeat(3, minmax(220px, 1fr));
      grid-template-areas:
        "district map hourly"
        "district map category"
        "district map scatter";
      gap: 16px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 14px 10px;
      box-shadow: 0 10px 20px rgba(88, 60, 54, 0.08);
      display: flex;
      flex-direction: column;
    }

    .panel h3 {
      margin: 4px 2px 10px;
      font-size: 16px;
      color: var(--ink);
    }

    .panel small {
      color: var(--muted);
    }

    .chart {
      flex: 1;
      min-height: 220px;
    }

    .panel-district {
      grid-area: district;
      min-height: 560px;
    }

    .panel-hourly {
      grid-area: hourly;
    }

    .panel-category {
      grid-area: category;
    }

    .panel-scatter {
      grid-area: scatter;
    }

    .panel-map {
      grid-area: map;
      min-height: 520px;
    }

    @media (max-width: 1100px) {
      .grid {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(6, minmax(220px, auto));
        grid-template-areas:
          "map"
          "district"
          "hourly"
          "category"
          "stacked"
          "scatter";
      }

      .panel-map {
        min-height: 360px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>上海夜间消费活力与时段热度大屏</h1>
    </header>

    <section class="kpi-grid">
      <div class="kpi-card">
        <span>订单总量</span>
        <strong id="kpi-total-orders">--</strong>
      </div>
      <div class="kpi-card">
        <span>总消费额</span>
        <strong id="kpi-total-revenue">--</strong>
      </div>
      <div class="kpi-card">
        <span>平均客单价</span>
        <strong id="kpi-avg-order">--</strong>
      </div>
      <div class="kpi-card">
        <span>平均评分</span>
        <strong id="kpi-avg-rating">--</strong>
      </div>
    </section>

    <section class="grid">
      <div class="panel panel-district">
        <h3>区县消费额动态排名</h3>
        <div id="chart-district" class="chart"></div>
        <small>按小时更新 · 单位：元</small>
      </div>
      <div class="panel panel-hourly">
        <h3>夜间时段客单价（工作日 vs 周末）</h3>
        <div id="chart-hourly" class="chart"></div>
        <small>单位：元</small>
      </div>
      <div class="panel panel-category">
        <h3>POI 热词云</h3>
        <div id="chart-wordcloud" class="chart"></div>
        <small>基于 poi_name_clean 词频</small>
      </div>
      <div class="panel panel-scatter">
        <h3>评分与客单价分布</h3>
        <div id="chart-scatter" class="chart"></div>
        <small>点色区分品类</small>
      </div>
      <div class="panel panel-map">
        <h3>上海夜间消费热力图</h3>
        <div id="chart-map" class="chart"></div>
        <small>按 POI 累计消费额</small>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts-wordcloud@2/dist/echarts-wordcloud.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/maptalks/dist/maptalks.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts-gl@2/dist/echarts-gl.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mapbox-gl@2.15.0/dist/mapbox-gl.js"></script>
  <link
    href="https://cdn.jsdelivr.net/npm/mapbox-gl@2.15.0/dist/mapbox-gl.css"
    rel="stylesheet"
  />
  <script src="./bundle.js"></script>
  <script src="./override_weekend.js"></script>
  <script>
    const data = window.DASHBOARD_DATA;
    const textColor = "#3b2e2a";
    const muted = "#7a5c55";

    const fmtMoney = (val) => {
      const num = Number(val || 0);
      if (num >= 10000) {
        return `${(num / 10000).toFixed(1)} 万`;
      }
      return num.toFixed(0);
    };

    document.getElementById("kpi-total-orders").textContent =
      data.kpi.totalOrders.toLocaleString("zh-CN");
    document.getElementById("kpi-total-revenue").textContent =
      fmtMoney(data.kpi.totalRevenue);
    document.getElementById("kpi-avg-order").textContent =
      `${data.kpi.avgOrder.toFixed(1)} 元`;
    document.getElementById("kpi-avg-rating").textContent =
      data.kpi.avgRating.toFixed(2);

    const districtChart = echarts.init(document.getElementById("chart-district"));
    const districtCsvUrl = "../data/synthetic/district_hourly_revenue.csv";
    const districtColors = [
      "#6bc0fb",
      "#7fec9d",
      "#fedd8b",
      "#ffa597",
      "#84e4dd",
      "#749f83",
      "#ca8622",
      "#bda29a",
      "#a8d8ea",
      "#aa96da",
    ];

    const parseCsv = (text) => {
      const lines = text.trim().split(/\r?\n/);
      if (!lines.length) {
        return { headers: [], rows: [] };
      }
      const headers = lines[0].split(",").map((h) => h.trim());
      const rows = lines.slice(1).map((line) => line.split(","));
      return { headers, rows };
    };

    fetch(districtCsvUrl)
      .then((res) => res.text())
      .then((csvText) => {
        const { headers, rows } = parseCsv(csvText);
        if (headers.length < 2 || !rows.length) {
          throw new Error("district csv is empty");
        }

        const districts = headers.slice(1);
        const timeLabels = rows.map((row) => row[0]);
        const paletteMap = new Map(
          districts.map((name, idx) => [name, districtColors[idx % districtColors.length]])
        );

        const option = {
          baseOption: {
            timeline: {
              axisType: "category",
              autoPlay: true,
              playInterval: 1200,
              left: "5%",
              right: "5%",
              bottom: 6,
              height: 10,
              label: { color: muted },
              lineStyle: { color: "rgba(0,0,0,0.15)" },
              checkpointStyle: {
                color: "#d16b5f",
                borderColor: "#d16b5f",
              },
              controlStyle: {
                color: "#d16b5f",
                borderColor: "#d16b5f",
              },
              data: timeLabels,
            },
            grid: { left: 16, right: 24, top: 10, bottom: 54, containLabel: true },
            tooltip: { trigger: "axis", axisPointer: { type: "shadow" } },
            xAxis: {
              type: "value",
              axisLabel: { color: muted },
              splitLine: { lineStyle: { color: "rgba(0,0,0,0.06)" } },
            },
            yAxis: {
              type: "category",
              axisLabel: { color: muted },
              axisTick: { show: false },
              axisLine: { show: false },
            },
            series: [
              {
                type: "bar",
                barWidth: 14,
                label: { show: true, position: "right", color: textColor },
                itemStyle: {
                  color: (params) => paletteMap.get(params.name) || "#d16b5f",
                  borderRadius: [6, 6, 6, 6],
                },
              },
              {
                type: "bar",
                barWidth: 14,
                barGap: "-100%",
                label: {
                  show: true,
                  position: "left",
                  color: textColor,
                  formatter: (p) => p.name,
                },
                itemStyle: {
                  color: (params) => paletteMap.get(params.name) || "#d16b5f",
                  opacity: 0.15,
                  borderRadius: [6, 6, 6, 6],
                },
              },
            ],
          },
          options: [],
        };

        rows.forEach((row) => {
          const metrics = districts.map((name, idx) => ({
            name,
            value: Number(row[idx + 1] || 0),
          }));

          const topMetrics = metrics
            .sort((a, b) => b.value - a.value)
            .slice(0, 8)
            .sort((a, b) => a.value - b.value);

          option.options.push({
            yAxis: { data: topMetrics.map((item) => item.name) },
            series: [
              { data: topMetrics.map((item) => item.value.toFixed(0)) },
              { data: topMetrics.map((item) => item.value.toFixed(0)) },
            ],
          });
        });

        districtChart.setOption(option);
      })
      .catch((error) => {
        districtChart.setOption({
          title: {
            text: "区县排名数据加载失败",
            left: "center",
            top: "center",
            textStyle: { color: muted, fontSize: 12 },
          },
        });
        console.error(error);
      });

    const hourlyChart = echarts.init(document.getElementById("chart-hourly"));
    hourlyChart.setOption({
      grid: { left: 50, right: 30, top: 20, bottom: 30 },
      legend: { textStyle: { color: muted } },
      xAxis: {
        type: "category",
        data: data.hours.map((h) => `${h}:00`),
        axisLabel: { color: muted },
      },
      yAxis: {
        type: "value",
        axisLabel: { color: muted },
        splitLine: { lineStyle: { color: "rgba(0,0,0,0.06)" } },
      },
      series: [
        {
          name: "工作日",
          type: "line",
          data: data.hourlyAvg.weekday.map((v) => Number(v.toFixed(2))),
          smooth: true,
          lineStyle: { color: "#7b8c99" },
          itemStyle: { color: "#7b8c99" },
        },
        {
          name: "周末",
          type: "line",
          data: data.hourlyAvg.weekend.map((v) => Number(v.toFixed(2))),
          smooth: true,
          lineStyle: { color: "#f0a25b" },
          itemStyle: { color: "#f0a25b" },
        },
      ],
    });

    const wordCloudChart = echarts.init(document.getElementById("chart-wordcloud"));
    const wordCloudCsvUrl = "../data/synthetic/poi_name_word_freq.csv";

    const parseWordCloudCsv = (text) => {
      const lines = text.trim().split(/\r?\n/);
      if (lines.length < 2) {
        return [];
      }
      return lines.slice(1).map((line) => {
        const [name, count] = line.split(",");
        return {
          name: (name || "").trim(),
          value: Number(count || 0),
        };
      });
    };

    fetch(wordCloudCsvUrl)
      .then((res) => res.text())
      .then((csvText) => {
        const cloudData = parseWordCloudCsv(csvText).slice(0, 200);
        wordCloudChart.setOption({
          backgroundColor: "#F7F7F7",
          tooltip: { show: true },
          series: [
            {
              name: "热点分析",
              type: "wordCloud",
              sizeRange: [8, 56],
              rotationRange: [-45, 90],
              textPadding: 0,
              autoSize: { enable: true, minSize: 8 },
              textStyle: {
                color: () =>
                  `rgb(${[
                    Math.round(Math.random() * 160),
                    Math.round(Math.random() * 160),
                    Math.round(Math.random() * 160),
                  ].join(",")})`,
              },
              emphasis: {
                shadowBlur: 10,
                shadowColor: "#333",
              },
              data: cloudData,
            },
          ],
        });
      })
      .catch((error) => {
        wordCloudChart.setOption({
          title: {
            text: "词云数据加载失败",
            left: "center",
            top: "center",
            textStyle: { color: muted, fontSize: 12 },
          },
        });
        console.error(error);
      });

    const scatterChart = echarts.init(document.getElementById("chart-scatter"));
    const categories = Array.from(new Set(data.scatter.map((d) => d.category)));
    const scatterSeries = categories.map((cat, idx) => ({
      name: cat,
      type: "scatter",
      data: data.scatter
        .filter((d) => d.category === cat)
        .map((d) => [d.amount, d.rating, d.amount, d.rating, cat]),
      itemStyle: {
        opacity: 0.8,
        shadowBlur: 10,
        shadowOffsetX: 0,
        shadowOffsetY: 0,
        shadowColor: "rgba(0, 0, 0, 0.35)",
      },
    }));

    scatterChart.setOption({
      backgroundColor: "#333",
      color: ["#dd4444", "#fec42c", "#80F1BE"],
      legend: {
        top: 0,
        textStyle: { color: "#fff", fontSize: 12 },
        data: categories,
      },
      grid: { left: "10%", right: 120, top: "16%", bottom: "10%" },
      tooltip: {
        padding: 10,
        backgroundColor: "#222",
        borderColor: "#777",
        borderWidth: 1,
        formatter: (obj) => {
          const value = obj.value;
          return (
            '<div style="border-bottom: 1px solid rgba(255,255,255,.3); font-size: 14px;padding-bottom: 6px;margin-bottom: 6px">' +
            `${obj.seriesName} · 客单价 ${value[0].toFixed(0)} 元` +
            "</div>" +
            `评分：${value[1].toFixed(2)}<br>`
          );
        },
      },
      xAxis: {
        type: "value",
        name: "客单价（元）",
        nameGap: 14,
        nameTextStyle: { color: "#fff", fontSize: 12 },
        splitLine: { show: false },
        axisLine: { lineStyle: { color: "#777" } },
        axisTick: { lineStyle: { color: "#777" } },
        axisLabel: { color: "#fff" },
      },
      yAxis: {
        type: "value",
        name: "评分",
        nameLocation: "end",
        nameGap: 16,
        nameTextStyle: { color: "#fff", fontSize: 12 },
        axisLine: { lineStyle: { color: "#777" } },
        axisTick: { lineStyle: { color: "#777" } },
        splitLine: { show: false },
        axisLabel: { color: "#fff" },
      },
      visualMap: [
        {
          left: "right",
          top: "14%",
          dimension: 0,
          min: 0,
          max: Math.max(...data.scatter.map((d) => d.amount)),
          itemWidth: 20,
          itemHeight: 100,
          calculable: true,
          precision: 0.1,
          text: ["圆形大小：客单价"],
          textGap: 16,
          textStyle: { color: "#fff" },
          inRange: { symbolSize: [8, 38] },
          outOfRange: { symbolSize: [8, 38], color: ["rgba(255,255,255,.2)"] },
          controller: {
            inRange: { color: ["#c23531"] },
            outOfRange: { color: ["#444"] },
          },
        },
        {
          left: "right",
          bottom: "6%",
          dimension: 1,
          min: 0,
          max: 5,
          itemHeight: 100,
          calculable: true,
          precision: 0.1,
          text: ["明暗：评分"],
          textGap: 16,
          textStyle: { color: "#fff" },
          inRange: { colorLightness: [1, 0.45] },
          outOfRange: { color: ["rgba(255,255,255,.2)"] },
          controller: {
            inRange: { color: ["#c23531"] },
            outOfRange: { color: ["#444"] },
          },
        },
      ],
      series: scatterSeries,
    });

    const mapChart = echarts.init(document.getElementById("chart-map"));
    const MapboxStyleDataURL = "../data/assets/data-1522488401196-HJYUN03qz.json";
    const uploadedDataURL = "../data/assets/data-1521463392670-HkYvx4TtG.json";

    const gridToLngLat = (lonCol, latCol) => {
      const lat1 = 30.6666667;
      const lat2 = 31.8833333;
      const lon1 = 120.866667;
      const lon2 = 122.2;
      const accuracy = 500;
      const latStart = Math.min(lat1, lat2);
      const lonStart = Math.min(lon1, lon2);
      const deltaLon =
        (accuracy * 360) /
        (2 * Math.PI * 6371004 * Math.cos(((lat1 + lat2) * Math.PI) / 360));
      const deltaLat = (accuracy * 360) / (2 * Math.PI * 6371004);
      const hbLon = lonCol * deltaLon + (lonStart - deltaLon / 2);
      const hbLat = latCol * deltaLat + (latStart - deltaLat / 2);
      return [hbLon, hbLat];
    };

    mapChart.showLoading("default", { text: "正在加载热力数据..." });

    fetch(MapboxStyleDataURL)
      .then((res) => res.json())
      .then(() => fetch(uploadedDataURL))
      .then((res) => res.json())
      .then((linedata) => {
        mapChart.hideLoading();

        const frames = Array.isArray(linedata?.[0]) ? linedata[0] : [];
        const maxValue = Number(linedata?.[1] || 0);
        const timelineLabels = Array.isArray(linedata?.[2]) ? linedata[2] : [];

        const option = {
          baseOption: {
            timeline: {
              axisType: "category",
              orient: "vertical",
              autoPlay: true,
              inverse: true,
              playInterval: 1000,
              right: 0,
              bottom: 40,
              width: 55,
              label: {
                color: "#ffffff",
              },
              symbol: "circle",
              lineStyle: {
                color: "#555",
              },
              checkpointStyle: {
                color: "#bbb",
                borderColor: "#777",
                borderWidth: 2,
              },
              controlStyle: {
                color: "#666",
                borderColor: "#666",
              },
              data: [],
            },
            title: {
              text: "上海居民活动点分布可视化",
              right: "5%",
              textStyle: {
                color: "#ffffff",
                fontSize: 18,
              },
            },
            visualMap: {
              show: false,
              calculable: true,
              realtime: false,
              inRange: {
                color: [
                  "#313695",
                  "#4575b4",
                  "#74add1",
                  "#abd9e9",
                  "#e0f3f8",
                  "#ffffbf",
                  "#fee090",
                  "#fdae61",
                  "#f46d43",
                  "#d73027",
                  "#a50026",
                ],
              },
              outOfRange: {
                colorAlpha: 0,
              },
            },
            maptalks3D: {
              center: [121.4693, 31.21307],
              zoom: 10,
              pitch: 40,
              urlTemplate:
                "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png",
              postEffect: {
                enable: true,
                FXAA: { enable: true },
              },
              light: {
                main: {
                  intensity: 1,
                  shadow: true,
                  shadowQuality: "high",
                },
                ambient: { intensity: 0.2 },
              },
            },
            series: [
              {
                type: "bar3D",
                shading: "realistic",
                coordinateSystem: "maptalks3D",
                barSize: 0.5,
                silent: true,
              },
            ],
          },
          options: [],
        };

        frames.forEach((timedata, idx) => {
          const label = timelineLabels[idx] ?? `T${idx + 1}`;
          option.baseOption.timeline.data.push(label);

          const dataSeries = [];
          for (let i = 0; i < timedata.length; i += 1) {
            const lonCol = timedata[i][0];
            const latCol = timedata[i][1];
            const count = timedata[i][2];
            const [lon, lat] = gridToLngLat(lonCol, latCol);
            dataSeries.push({ value: [lon, lat, count] });
          }

          dataSeries.push({ value: [120, 30, maxValue] });

          option.options.push({
            visualMap: { max: maxValue },
            series: [{ data: dataSeries }],
          });
        });

        if (!option.baseOption.timeline.data.length) {
          option.baseOption.timeline.show = false;
        }

        mapChart.setOption(option, true);
      })
      .catch((error) => {
        mapChart.hideLoading();
        mapChart.setOption({
          title: {
            text: "热力数据加载失败",
            textStyle: { color: textColor, fontSize: 14 },
            left: "center",
            top: "center",
          },
        });
        console.error(error);
      });
  </script>
</body>
</html>
