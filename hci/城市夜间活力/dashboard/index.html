<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>夜间经济可视化导航</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f5d2c8;
      --bg-soft: #f9e3d9;
      --ink: #3b2e2a;
      --muted: #7a5c55;
      --panel: #fff7f3;
      --accent: #d16b5f;
      --border: rgba(84,56,50,0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Lexend", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: linear-gradient(160deg, var(--bg) 0%, var(--bg-soft) 60%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 24px 80px;
    }
    h1 {
      font-family: "ZCOOL XiaoWei", serif;
      font-size: clamp(24px, 4vw, 40px);
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 48px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 960px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 10px 24px rgba(88,60,54,0.08);
      text-decoration: none;
      color: inherit;
      transition: transform 0.18s, box-shadow 0.18s;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 18px 36px rgba(88,60,54,0.14); }
    .card-icon  { font-size: 32px; line-height: 1; }
    .card-title { font-size: 18px; font-weight: 600; }
    .card-desc  { font-size: 13px; color: var(--muted); line-height: 1.6; }
    .card-tag {
      display: inline-block;
      font-size: 11px;
      padding: 2px 10px;
      border-radius: 20px;
      background: rgba(209,107,95,0.12);
      color: var(--accent);
      width: fit-content;
    }
  </style>
</head>
<body>
  <h1>上海夜间经济可视化</h1>
  <p class="subtitle">选择一个分析视图进入</p>

  <div class="grid">

    <a href="./dashboard.html" class="card">
      <span class="card-icon">🌃</span>
      <span class="card-title">消费活力大屏</span>
      <p class="card-desc">区县消费排名、夜间时段热度、POI 词云、评分散点与热力地图</p>
    </a>

    <a href="./flow.html" class="card">
      <span class="card-icon">🚶</span>
      <span class="card-title">人流可视化</span>
      <p class="card-desc">网格热力、flow_in/out 时序、stay_duration 分布</p>
    </a>

    <a href="./solution.html" class="card">
      <span class="card-icon">📊</span>
      <span class="card-title">夜晚活力影响因子分析</span>
      <p class="card-desc">基于街道维度的多指标对比分析</p>
    </a>

  </div>
</body>
</html>
